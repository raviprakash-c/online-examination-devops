services:
  mysql:
    image: mysql:8.0
    container_name: online-exam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: online_exam
      MYSQL_USER: ${MYSQL_USER:-examuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-exampassword}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: online-exam-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: online_exam
      DB_USER: ${MYSQL_USER:-examuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-exampassword}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SESSION_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      LOG_LEVEL: INFO
      FLASK_DEBUG: "false"
      PORT: "5000"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: online-exam-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mysql_data:
