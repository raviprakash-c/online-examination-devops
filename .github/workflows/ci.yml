name: Online Examination CI

on:
  push:
    branches:
      - main
      - "process-*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run backend tests
        run: python -m pytest -q

      - name: Check frontend JavaScript
        run: node --check frontend/app.js

      - name: Validate Docker Compose
        run: docker compose -f docker/docker-compose.yml config

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t online-exam-backend:ci .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t online-exam-frontend:ci .
