name: Deploy Online Examination System

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          EC2_HOST: \${{ secrets.EC2_HOST }}
          EC2_USER: \${{ secrets.EC2_USER }}
          EC2_SSH_KEY: \${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/online-exam-key
          chmod 600 ~/.ssh/online-exam-key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        shell: bash
        env:
          EC2_HOST: \${{ secrets.EC2_HOST }}
          EC2_USER: \${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/online-exam-key "$EC2_USER@$EC2_HOST" '
            set -e
            cd ~/online-examination-devops
            git fetch origin
            git reset --hard origin/main
            docker compose -f docker/docker-compose.yml up -d --build
            docker compose -f docker/docker-compose.yml exec -T backend python -m backend.create_admin
            docker compose -f docker/docker-compose.yml ps
            curl -fsS http://127.0.0.1/ >/dev/null
          '

